# The example server Pod the example-probe collector lists, not Ready.
apiVersion: v1
kind: Pod
metadata:
  name: example-server
  namespace: vendor-system
  labels:
    app: example-server
spec:
  containers:
    - name: server
      image: registry.example.com/example-server:v1.0.0
status:
  phase: Running
  conditions:
    - type: Ready
      status: "False"
