row: 18
title: a token in a Prometheus label value and comment; a non-Prometheus body on the metrics path
cases:
  - name: metrics
    type: prometheus
    input: metrics.txt
    canaries:
      - {value: kgwctl-canary-18-help, rule: pattern, location: "line:1"}
      - {value: kgwctl-canary-18-label, rule: pattern, location: "line:3"}
    keep:
      - "# TYPE kgateway_translations_total counter"
      - 'kgateway_translations_total{gateway="gw",namespace="team-a"} 12'
      - 'token_source="[redacted]"'
  - name: html
    type: prometheus
    input: html.txt
    expectError: not-prometheus
    canaries:
      - {value: kgwctl-canary-18-html}
