apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-a
  namespace: team-a
spec:
  parentRefs:
    - name: gw
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
          headers:
            - type: Exact
              name: x-api-key
              value: kgwctl-canary-03-match
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Authorization
                value: Bearer kgwctl-canary-03-set
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: x-served-by
                value: kgwctl-canary-03-add
      backendRefs:
        - name: svc-a
          port: 8080
