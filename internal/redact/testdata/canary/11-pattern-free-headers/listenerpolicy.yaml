apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: access-logs
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw
  default:
    accessLog:
      - grpcService:
          logName: access
          backendRef:
            name: otel-collector
            port: 4317
          initialMetadata:
            - key: x-collector-tenant
              value: kgwctl-canary-11-meta
    httpSettings:
      earlyRequestHeaderModifier:
        set:
          - name: x-tenant-key
            value: kgwctl-canary-11-early
