# The policies.json Gateway with one Ready proxy Pod. HTTPRoute
# proxy/orders-kgwctl is absent, so only kgwctl-proxy/orders names the
# colliding routes in the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: kgwctl-proxy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: proxy
  namespace: kgwctl-proxy
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: kgwctl-proxy
spec:
  parentRefs:
    - name: proxy
  hostnames: ["orders.kgwctl.example"]
  rules:
    - backendRefs:
        - name: orders
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public
  namespace: kgwctl-proxy
spec:
  parentRefs:
    - name: proxy
  hostnames: ["public.kgwctl.example"]
  rules:
    - backendRefs:
        - name: public
          port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: proxy-7d9f8c6b5-k2x
  namespace: kgwctl-proxy
  labels:
    gateway.networking.k8s.io/gateway-name: proxy
spec:
  containers:
    - name: kgateway-proxy
      image: cr.kgateway.dev/kgateway-dev/envoy-wrapper:v2.5.1
status:
  phase: Running
  conditions:
    - type: Ready
      status: "True"
