# Binds the kgwctl-reader ClusterRole from docs/rbac.yaml to the test user.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kgwctl-test-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kgwctl-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: kgwctl-test-reader
