          status: "True"
          reason: ResolvedRefs
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"

---
apiVersion: v1
kind: Service
metadata:
  name: example
  namespace: default
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: example-abcde
  namespace: default
  labels:
    kubernetes.io/service-name: example
addressType: IPv4
ports:
