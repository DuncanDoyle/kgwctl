# The install's Gateway API objects for check: a GatewayClass, a Gateway and
# an HTTPRoute whose backend Service has a ready endpoint, and the Gateway's
# ready proxy Deployment and Pod.
apiVersion: v1
kind: Namespace
metadata:
  name: kgateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kgateway
spec:
  controllerName: kgateway.dev/kgateway
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: ""
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: ""
      observedGeneration: 1
