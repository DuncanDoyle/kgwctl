      supportedKinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
        - type: Programmed
          status: "True"
          reason: Programmed
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example
  namespace: default
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  rules:
    - backendRefs:
        - name: example
          port: 8080
status:
