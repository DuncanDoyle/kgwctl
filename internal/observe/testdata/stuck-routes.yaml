# Ten HTTPRoutes on the healthy fixture's Gateway whose status the controller never writes.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stuck-0
  namespace: default
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  rules:
    - backendRefs:
