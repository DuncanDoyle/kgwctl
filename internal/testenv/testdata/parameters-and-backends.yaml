# Applied after healthy.yaml: kinds the library never attributes, shown with an
# install present (design §6.2). GatewayClass kgateway-custom names
# GatewayParameters kgateway-system/custom. Backends: static-ok accepted,
# static-stale with observedGeneration 0, static-bare with no status.
# default/to-backend sends to static-ok.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: custom
  namespace: kgateway-system
spec:
  kube: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kgateway-custom
spec:
  controllerName: kgateway.dev/kgateway
  parametersRef:
    group: gateway.kgateway.dev
    kind: GatewayParameters
    name: custom
    namespace: kgateway-system
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: ""
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: static-ok
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: example.com
        port: 80
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: ""
      observedGeneration: 1
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: static-stale
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: example.org
        port: 80
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: ""
      observedGeneration: 0
      lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: static-bare
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: example.net
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: to-backend
  namespace: default
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames:
    - backend.example.com
  rules:
    - backendRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: static-ok
        - name: example
          port: 8080
status:
  parents:
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: http
        namespace: kgateway-system
      controllerName: kgateway.dev/kgateway
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
