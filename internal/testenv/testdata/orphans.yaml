# Applied after healthy.yaml: objects no controller has accepted, and the
# kinds the library never attributes. All stay visible (design §6.2).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: to-missing
  namespace: default
spec:
  parentRefs:
    - name: missing
      namespace: kgateway-system
  rules:
    - backendRefs:
        - name: example
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-parents
  namespace: default
spec:
  rules:
    - backendRefs:
        - name: example
          port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: no-ancestors
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: params
  namespace: default
spec:
  kube: {}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: static
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: example.com
        port: 80
