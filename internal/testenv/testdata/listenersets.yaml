# Applied after healthy.yaml, with the XListenerSet CRD from
# crds/xlistenerset installed: a ListenerSet and an XListenerSet on
# kgateway-system/http, and a route to each.
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: extra
  namespace: kgateway-system
spec:
  parentRef:
    name: http
  listeners:
    - name: extra
      protocol: HTTP
      port: 8081
---
apiVersion: gateway.networking.x-k8s.io/v1alpha1
kind: XListenerSet
metadata:
  name: extra-x
  namespace: kgateway-system
spec:
  parentRef:
    name: http
  listeners:
    - name: extra-x
      protocol: HTTP
      port: 8082
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: via-extra
  namespace: kgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: extra
  rules:
    - backendRefs:
        - name: example
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: via-extra-x
  namespace: kgateway-system
spec:
  parentRefs:
    - group: gateway.networking.x-k8s.io
      kind: XListenerSet
      name: extra-x
  rules:
    - backendRefs:
        - name: example
          port: 8080
