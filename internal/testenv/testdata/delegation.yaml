# Applied after healthy.yaml: HTTPRoute delegation. default/parent delegates
# to default/child-a, which reports the edge. default/declared names
# default/example as its parent route with no status: a declared candidate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent
  namespace: default
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  rules:
    - backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: child-a
status:
  parents:
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: http
        namespace: kgateway-system
      controllerName: kgateway.dev/kgateway
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: child-a
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: parent
  rules:
    - backendRefs:
        - name: example
          port: 8080
status:
  parents:
    - parentRef:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: parent
        namespace: default
      controllerName: kgateway.dev/kgateway
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: declared
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example
  rules:
    - backendRefs:
        - name: example
          port: 8080
