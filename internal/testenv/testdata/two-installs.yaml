# Two kgateway installs, each scoped to one namespace by
# KGW_DISCOVERY_NAMESPACE_SELECTORS: kgw-a owns team-a/web, kgw-b owns team-b/api.
# kgw-b wants 2 replicas and has 1 ready.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kgateway
spec:
  controllerName: kgateway.dev/kgateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kgateway
  namespace: kgw-a
  labels:
    kgateway: kgateway
    app.kubernetes.io/name: kgateway
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: 2.5.0
spec:
  replicas: 1
  selector:
    matchLabels:
      kgateway: kgateway
  template:
    metadata:
      labels:
        kgateway: kgateway
        app.kubernetes.io/name: kgateway
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: 2.5.0
    spec:
      containers:
        - name: kgateway
          image: cr.kgateway.dev/kgateway-dev/kgateway:v2.5.0
          env:
            - name: KGW_DISCOVERY_NAMESPACE_SELECTORS
              value: '[{"matchLabels":{"kubernetes.io/metadata.name":"team-a"}}]'
status:
  observedGeneration: 1
  replicas: 1
  updatedReplicas: 1
  readyReplicas: 1
  availableReplicas: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: kgateway-7d9f8b6c5-0
  namespace: kgw-a
  labels:
    kgateway: kgateway
    app.kubernetes.io/name: kgateway
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: 2.5.0
spec:
  containers:
    - name: kgateway
      image: cr.kgateway.dev/kgateway-dev/kgateway:v2.5.0
      env:
        - name: KGW_DISCOVERY_NAMESPACE_SELECTORS
          value: '[{"matchLabels":{"kubernetes.io/metadata.name":"team-a"}}]'
status:
  phase: Running
  conditions:
    - type: Ready
      status: "True"
  containerStatuses:
    - name: kgateway
      image: cr.kgateway.dev/kgateway-dev/kgateway:v2.5.0
      imageID: ""
      ready: true
      restartCount: 0
      started: true
      state:
        running:
          startedAt: "2026-01-01T00:00:00Z"
---
apiVersion: apps/v1
