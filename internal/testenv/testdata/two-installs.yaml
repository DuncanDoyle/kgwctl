    kgateway: kgateway
    app.kubernetes.io/name: kgateway
    app.kubernetes.io/component: controller
    app.kubernetes.io/version: 2.5.0
spec:
  replicas: 2
  selector:
    matchLabels:
      kgateway: kgateway
  template:
    metadata:
      labels:
        kgateway: kgateway
        app.kubernetes.io/name: kgateway
        app.kubernetes.io/component: controller
        app.kubernetes.io/version: 2.5.0
    spec:
      containers:
        - name: kgateway
