# Applied after healthy.yaml and listenersets.yaml: default/rejected names
# kgateway-system/http and is not accepted; default/route-policy has one
# ancestor our controller accepted.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rejected
  namespace: default
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - rejected.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: x-team
              value: a
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-via
                value: kgw
      backendRefs:
        - name: api
          port: 8080
          weight: 90
        - name: api-canary
          port: 8080
          weight: 10
status:
  parents:
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: http
        namespace: kgateway-system
        sectionName: http
      controllerName: kgateway.dev/kgateway
      conditions:
        - type: Accepted
          status: "False"
          reason: NotAllowedByListeners
          message: hostname rejected.example.com matches no listener
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: route-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example
status:
  ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: http
        namespace: kgateway-system
      controllerName: kgateway.dev/kgateway
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: ""
          observedGeneration: 1
          lastTransitionTime: "2026-01-01T00:00:00Z"
