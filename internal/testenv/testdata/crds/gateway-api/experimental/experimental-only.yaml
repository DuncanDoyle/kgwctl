                        SpanName defines a custom name for the OTel span. By default, the name
                        is implementation-specific.

                        Support: Extended

                        Feature Name: TelemetryPolicyTracing
                      maxLength: 256
                      minLength: 1
                      pattern: ^[a-zA-Z0-9_.:/-]+( [a-zA-Z0-9_.:/-]+)*$
                      type: string
                  type: object
                  x-kubernetes-validations:
