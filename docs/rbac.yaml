# Least-privilege, read-only access for kgwctl (design §5, D-017): get, list and
# watch on the kinds the checks read, plus get on pods/proxy for controller metrics and Envoy stats.
# No Secrets, no ConfigMaps, no pods/log, no write verbs. The reader role grants no
# pods/portforward; the optional Role at the end adds it for the proxy commands.
# Bind the ClusterRole to your own user or group; the ServiceAccount below is
# the one the live check uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kgwctl-reader
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - listenersets
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - backendtlspolicies
      - referencegrants
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.x-k8s.io"]
    resources: ["xlistenersets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.kgateway.dev"]
    resources:
      - trafficpolicies
      - listenerpolicies
      - httplistenerpolicies
      - backendconfigpolicies
      - gatewayparameters
      - backends
      - directresponses
      - gatewayextensions
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kgwctl-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kgwctl-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kgwctl-reader
subjects:
  - kind: ServiceAccount
    name: kgwctl-reader
    namespace: default
---
# Optional: the proxy commands (D-021). Uncomment, set the Gateway's namespace
# and the subject, and apply.
#
# Live `proxy routes` and `proxy dump` require `create pods/portforward`. kgwctl
# sends only `GET /config_dump`, but the grant allows any TCP forwarding to Pods
# in the namespace, including Envoy admin operations that change or stop the
# proxy. RBAC cannot narrow it to a port or path. Bind it only to trusted operators.
