# Least-privilege, read-only access for kgwctl (design §6.3): get, list and
# watch on the served kinds, Namespaces, Pods, Deployments and CRDs.
# No Secrets, no ConfigMaps, no pods/portforward, no write verbs.
# Bind the ClusterRole to your own user or group; the ServiceAccount below is
# the one the live check uses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kgwctl-reader
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - listenersets
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - backendtlspolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.x-k8s.io"]
    resources: ["xlistenersets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.kgateway.dev"]
    resources:
      - trafficpolicies
      - listenerpolicies
      - httplistenerpolicies
      - backendconfigpolicies
      - gatewayparameters
      - backends
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kgwctl-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kgwctl-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kgwctl-reader
subjects:
  - kind: ServiceAccount
    name: kgwctl-reader
    namespace: default
